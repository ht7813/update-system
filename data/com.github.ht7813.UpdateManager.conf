<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="com.github.ht7813.UpdateManager"/>
  </policy>
  <policy context="default">
    <!-- 允许所有用户调用方法，具体授权交给 polkit -->
    <allow send_destination="com.github.ht7813.UpdateManager"/>
    <allow receive_sender="com.github.ht7813.UpdateManager"/>
  </policy>
</busconfig>